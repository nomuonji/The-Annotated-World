name: Download historical sources for documentary prototype
on:
  push:
    branches: [prototype/japanese-marx-zizek-2026]
    paths:
      - .github/workflows/jp-photos.yml
      - scripts/prototypes/jp-download-photos.py
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - run: python scripts/prototypes/jp-download-photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: jp-marx-sourced-historical-images
          path: downloaded/
          retention-days: 7
