name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/verify-youtube-caption-capture.test.mjs
      - run: npm run content:check
      - run: npm run check
      - name: Ensure retired image paths have no runtime references
        run: |
          if git grep -I -n -F -e '/brand/annotator-cover.webp' -e '/brand/annotator-desk.avif' -e '/brand/annotator.webp' -- src public scripts tools templates; then
            echo 'Retired asset referenced'; exit 1
          fi
      - run: npm run build
      - run: npm run verify:archive
      - run: test -s dist/workspace/index.html
      - run: npx playwright install chromium
      - run: npm run verify:reader
      - name: Install Japanese fonts for screenshot audit
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: node scripts/verify-world.mjs
      - name: Audit WCAG checks and resource fallbacks
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund axe-core@4.14.1
          node scripts/verify-accessibility.mjs
      - name: Export world motion prototype
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          node scripts/render-world-motion.mjs
      - name: Live production smoke (external network)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/verify-production.mjs
      - name: Capture deployed public page types
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          AW_AUDIT_BASE: https://the-annotated-world.pages.dev
        run: node scripts/verify-world.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-audit
          path: world-audit/
          if-no-files-found: ignore
