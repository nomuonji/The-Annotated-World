name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/verify-youtube-caption-capture.test.mjs
      - run: npm run content:check
      - run: npm run check
      - run: npm run build
      - run: npm run verify:archive
      - run: test -s dist/workspace/index.html
      - run: npx playwright install chromium
      - run: npm run verify:reader
      - name: Install Japanese fonts for screenshot audit
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: node scripts/verify-world.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-audit
          path: world-audit/
          if-no-files-found: ignore
