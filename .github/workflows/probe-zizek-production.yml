name: Probe production Žižek excerpt page
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-zizek-production.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live Cloudflare Pages publication with bounded retries
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          url='https://the-annotated-world.pages.dev/read/slavoj-zizek-how-to-become-free/'
          catalog='https://the-annotated-world.pages.dev/catalog.json'
          for attempt in range(1,10):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'TheAnnotatedWorld-ProductionCheck/1.0'}),timeout=18) as r:
                      body=r.read().decode('utf-8')
                      status=r.status
                  with urllib.request.urlopen(urllib.request.Request(catalog,headers={'User-Agent':'TheAnnotatedWorld-ProductionCheck/1.0'}),timeout=18) as r:
                      data=json.loads(r.read().decode('utf-8'))
                  matches=('24箇所' in body and '12章' in body and 'RapidAPI' in body)
                  article=next((x for x in data.get('documents',[]) if x.get('id')=='slavoj-zizek-how-to-become-free'),None)
                  catalog_ok=bool(article and len(article.get('chapters',[]))==12)
                  print(f'LIVE_CHECK_ATTEMPT={attempt} HTTP={status} PAGE_MARKER={matches} CATALOG_12_CHAPTERS={catalog_ok}',flush=True)
                  if status==200 and matches and catalog_ok:
                      print('PRODUCTION_ZIZEK_EXCERPT=VERIFIED',flush=True)
                      break
              except Exception as e:
                  print(f'LIVE_CHECK_ATTEMPT={attempt} error={type(e).__name__}',flush=True)
              if attempt==9: raise SystemExit('PRODUCTION_ZIZEK_EXCERPT=UNVERIFIED')
              time.sleep(15)
          PY
