name: Acquire licensed source captions for Molly White study page
on:
  push:
    branches: [content/molly-white-blockchain-abuse]
    paths:
      - .github/workflows/molly-source-captions.yml
      - scripts/content/molly-source-captions.py
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/content/molly-source-captions.py
      - uses: actions/upload-artifact@v4
        with:
          name: molly-white-source-caption-evidence
          path: source-captions/
          retention-days: 7
