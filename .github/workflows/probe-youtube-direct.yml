name: Probe direct YouTube captions or audio
on:
  pull_request:
    paths:
      - scripts/probe-youtube-direct.py
      - .github/workflows/probe-youtube-direct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install YouTube-direct extractors (no transcript mirror API)
        run: python -m pip install --disable-pip-version-check --quiet --upgrade 'yt-dlp[default]' youtube-transcript-api
      - name: Attempt direct subtitle/auto-caption and audio sampling
        id: direct
        continue-on-error: true
        run: python scripts/probe-youtube-direct.py 4YSXNotY8QU
      - name: Report extraction gate
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.direct.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" = success ]; then
            echo 'Direct YouTube subtitle extraction returned success. Inspect CAPTURE_EVIDENCE in the previous step.'
          else
            echo '::warning::Direct YouTube transcript extraction was not verified. Do not publish any article. Inspect caption and audio failure diagnostics above.'
          fi
