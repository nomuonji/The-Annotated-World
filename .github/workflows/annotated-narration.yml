name: Annotated narration smoke
on:
  pull_request:
    paths:
      - 'tools/annotated-short/synthesize-kokoro.py'
      - '.github/workflows/annotated-narration.yml'
permissions:
  contents: read
jobs:
  voice:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng libsndfile1
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'kokoro==0.9.4' 'misaki[ja]==0.9.4' soundfile
          python -m unidic download
      - run: python tools/annotated-short/synthesize-kokoro.py --smoke --out /tmp/aw-narration
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-narration-smoke
          path: /tmp/aw-narration/
          retention-days: 7
