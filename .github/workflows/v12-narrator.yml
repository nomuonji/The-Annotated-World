name: The Annotated World v12 consistent female commentary
on:
  push:
    branches: [prototype/role-split-zizek-v12]
    paths:
      - .github/workflows/v12-narrator.yml
      - docs/prototypes/v12-female-commentary.json
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install edge-tts
      - name: Synthesize all commentary in one consistent voice, no voice-engine fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-commentary
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from edge_tts import Communicate
          s=json.load(open('docs/prototypes/v12-female-commentary.json',encoding='utf8'))
          async def main():
              for i,row in enumerate(s):
                  p=Path(f'out-commentary/{i:02d}-{row["key"]}.mp3')
                  for attempt in range(7):
                      try:
                          await Communicate(row["text"],voice='ja-JP-NanamiNeural',rate='+8%',pitch='+0Hz').save(str(p))
                          if p.stat().st_size < 1000: raise RuntimeError('empty audio')
                          break
                      except Exception as e:
                          print('retry',i,attempt,str(e)[:120],flush=True)
                          await asyncio.sleep(min(16,2*(attempt+1)))
                  else: raise RuntimeError('No matched female voice for '+row['key'])
                  print('SUCCESS_FEMALE_NANAMI',row['key'],p.stat().st_size,flush=True)
          asyncio.run(main())
          PY
          cp docs/prototypes/v12-female-commentary.json out-commentary/commentary.json
      - uses: actions/upload-artifact@v4
        with:
          name: v12-consistent-female-commentary
          path: out-commentary/
          retention-days: 14
