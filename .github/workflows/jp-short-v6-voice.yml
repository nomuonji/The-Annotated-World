name: V6 nuanced narration — slower English with bilingual semantic highlights
on:
  push:
    branches: [prototype/japanese-marx-zizek-2026]
    paths:
      - .github/workflows/jp-short-v6-voice.yml
      - docs/prototypes/jp-short-v6-script.json
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install edge-tts gTTS
      - name: Generate natural-rate English voiceover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice-v6
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from edge_tts import Communicate
          beats=json.load(open('docs/prototypes/jp-short-v6-script.json',encoding='utf8'))
          for item in beats:
              assert (not item['hi_en'] and not item['hi_ja']) or (item['hi_en'].lower() in item['en'].lower() and item['hi_ja'] in item['ja'])
          async def main():
              for i,entry in enumerate(beats):
                  f=f'voice-v6/{i:02d}.mp3'
                  import time
                  for attempt in range(3):
                      try:
                          await Communicate(entry['en'],voice='en-US-AndrewNeural',rate='+6%',pitch='-2Hz').save(f)
                          if Path(f).stat().st_size < 1000: raise RuntimeError('empty voice output')
                          break
                      except Exception as ex:
                          print('VOICE_RETRY',i,attempt,str(ex)[:120],flush=True)
                          await asyncio.sleep(2*(attempt+1))
                  else:
                      print('VOICE_FALLBACK_GTTS',i,flush=True)
                      from gtts import gTTS
                      gTTS(text=entry['en'],lang='en',slow=False).save(f)
                  print(i,Path(f).stat().st_size,flush=True)
          asyncio.run(main())
          PY
          cp docs/prototypes/jp-short-v6-script.json voice-v6/script.json
      - uses: actions/upload-artifact@v4
        with:
          name: zizek-v6-slower-english-voice
          path: voice-v6/
          retention-days: 14
